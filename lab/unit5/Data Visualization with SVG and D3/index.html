<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>D3.js Lab Manual – All Experiments in One File</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }
        svg {
            margin-top: 20px;
            border: 1px solid #ccc;
        }
        #myDiv {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>D3.js Lab Experiments – All in One index.html</h1>

    <!-- Experiment 10.1 SVG -->
    <h2>Experiment 10.1 – Bar Chart</h2>
    <svg id="chart1" width="600" height="300"></svg>

    <!-- Experiment 10.2 SVG -->
    <h2>Experiment 10.2 – Circles and Rectangles</h2>
    <svg id="chart2" width="500" height="200"></svg>

    <!-- Experiment 10.3 -->
    <h2>Experiment 10.3 – Modify HTML Element</h2>
    <div id="myDiv">Original Text</div>

    <!-- Experiment 10.4 SVG -->
    <h2>Experiment 10.4 – CSV Bar Chart</h2>
    <svg id="chart3" width="600" height="300"></svg>

    <!-- D3.js CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script>
        console.log("D3 Lab Loaded");


        /***********************************************
         * EXPERIMENT 10.1 – BASIC BAR CHART
         ***********************************************/
        const svg1 = d3.select("#chart1");

        const data1 = [30, 80, 45, 60, 20, 90, 50];
        const width1 = 600, height1 = 300;
        const barWidth1 = width1 / data1.length;

        const yScale1 = d3.scaleLinear()
            .domain([0, d3.max(data1)])
            .range([0, height1]);

        svg1.selectAll("rect")
            .data(data1)
            .enter()
            .append("rect")
            .attr("x", (d, i) => i * barWidth1)
            .attr("y", d => height1 - yScale1(d))
            .attr("width", barWidth1 - 2)
            .attr("height", d => yScale1(d))
            .attr("fill", "steelblue");



        /***********************************************
         * EXPERIMENT 10.2 – CIRCLES & RECTANGLES WITH EVENTS
         ***********************************************/
        const svg2 = d3.select("#chart2");

        // Circles
        svg2.selectAll("circle")
            .data([50, 150, 250, 350])
            .enter()
            .append("circle")
            .attr("cx", d => d)
            .attr("cy", 80)
            .attr("r", 25)
            .attr("fill", "orange")
            .on("mouseover", function () {
                d3.select(this).attr("fill", "red");
            })
            .on("mouseout", function () {
                d3.select(this).attr("fill", "orange");
            });

        // Rectangles
        svg2.selectAll("rect")
            .data([60, 160, 260, 360])
            .enter()
            .append("rect")
            .attr("x", d => d)
            .attr("y", 120)
            .attr("width", 40)
            .attr("height", 30)
            .attr("fill", "green")
            .on("click", function () {
                d3.select(this).attr("fill", "purple");
            });



        /***********************************************
         * EXPERIMENT 10.3 – MODIFY HTML ELEMENT
         ***********************************************/
        d3.select("#myDiv")
            .style("color", "blue")
            .style("font-size", "24px")
            .text("This text is modified by D3");



        /***********************************************
         * EXPERIMENT 10.4 – CSV DATA VISUALIZATION
         ***********************************************/

        // CSV data directly inside JS
        const csvData = [
            { year: "2016", value: 30 },
            { year: "2017", value: 50 },
            { year: "2018", value: 80 },
            { year: "2019", value: 45 },
            { year: "2020", value: 90 }
        ];

        const svg3 = d3.select("#chart3");
        const width3 = 600, height3 = 300;

        const xScale = d3.scaleBand()
            .domain(csvData.map(d => d.year))
            .range([0, width3])
            .padding(0.3);

        const yScale = d3.scaleLinear()
            .domain([0, d3.max(csvData, d => d.value)])
            .range([height3, 0]);

        svg3.selectAll("rect")
            .data(csvData)
            .enter()
            .append("rect")
            .attr("x", d => xScale(d.year))
            .attr("y", d => yScale(d.value))
            .attr("width", xScale.bandwidth())
            .attr("height", d => height3 - yScale(d.value))
            .attr("fill", "teal");

    </script>

</body>
</html>
