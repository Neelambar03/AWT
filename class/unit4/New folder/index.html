<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SVG to PNG Export - Stepwise Version</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        svg {
            border: 1px solid #000;
            margin-top: 10px;
            background: white;
        }
    </style>
</head>

<body>

    <h2>SVG → Canvas → PNG Export (Full Stepwise Code)</h2>

    <!-- ============================= -->
    <!-- STEP 1: Create SVG Figure    -->
    <!-- ============================= -->

    <svg id="mysvg" width="300" height="200" xmlns="http://www.w3.org/2000/svg">

        <!-- Background -->
        <rect width="300" height="200" fill="#fafafa"/>

        <!-- Title text -->
        <text x="150" y="40" font-size="22" text-anchor="middle" fill="black">
            Sample Figure
        </text>

        <!-- Shapes -->
        <circle cx="100" cy="120" r="40" fill="lightblue" stroke="black"/>
        <rect x="160" y="80" width="80" height="80" fill="lightgreen" stroke="black"/>

    </svg>


    <!-- ============================= -->
    <!-- STEP 2: Export Button         -->
    <!-- ============================= -->

    <br>
    <button onclick="exportPNG()">Download PNG</button>


    <!-- ============================= -->
    <!-- STEP 3: Hidden Canvas         -->
    <!-- ============================= -->

    <canvas id="canvas" width="300" height="200" style="display:none"></canvas>


    <!-- ============================= -->
    <!-- STEP 4: JavaScript Logic      -->
    <!-- ============================= -->

    <script>
        function exportPNG() {

            // Step 4.1 - Get SVG and Canvas elements
            const svg = document.getElementById("mysvg");
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            // Step 4.2 - Convert SVG object → XML text
            const svgData = new XMLSerializer().serializeToString(svg);

            // Step 4.3 - Create a Blob URL from the SVG text
            const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            // Step 4.4 - Create an Image() from the Blob URL
            const img = new Image();
            img.onload = function () {

                // Step 4.5 - Draw the loaded SVG image onto Canvas
                ctx.drawImage(img, 0, 0);

                // Step 4.6 - Convert Canvas → PNG Base64 string
                const pngURL = canvas.toDataURL("image/png");

                // Step 4.7 - Create a download link
                const a = document.createElement("a");
                a.href = pngURL;
                a.download = "figure.png";
                a.click();

                // Step 4.8 - Clean unused URL memory
                URL.revokeObjectURL(url);
            };

            // Step 4.9 - Load the Blob URL into the Image object
            img.src = url;
        }
    </script>

</body>
</html>
