<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>To-Do App (jQuery + Storage)</title>

  <!-- jQuery Library -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    /* ==== Basic App Layout ==== */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .todo-box {
      background: #fff;
      width: 360px;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #333;
    }

    /* ==== Input Area ==== */
    .input-area {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    input {
      width: 75%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 8px 12px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    /* ==== Task List ==== */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 250px;
      overflow-y: auto;
    }

    li {
      background: #f2f2f2;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete-btn {
      background: #ff4d4d;
      border: none;
      color: white;
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #e60000;
    }

    .session-info {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="todo-box">
    <h2>📝 To-Do App</h2>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Enter a task...">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="session-info" id="sessionInfo"></div>
  </div>

  <script>
    // -------------------------------
    // Helper functions for cookies
    // -------------------------------
    function setCookie(name, value, days) {
      let expires = "";
      if (days) {
        let date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (value || "") + expires + "; path=/";
    }

    function getCookie(name) {
      let nameEQ = name + "=";
      let ca = document.cookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
    }

    $(document).ready(function() {
      // -------------------------------
      // Session Management
      // -------------------------------
      if (!sessionStorage.getItem("userSession")) {
        let sessionId = "User-" + Math.floor(Math.random() * 1000);
        sessionStorage.setItem("userSession", sessionId);
      }
      let currentSession = sessionStorage.getItem("userSession");
      $("#sessionInfo").text("Session Active: " + currentSession);

      // -------------------------------
      // Cookies
      // -------------------------------
      if (!getCookie("userName")) {
        let userName = prompt("Enter your name:");
        if (userName) {
          setCookie("userName", userName, 7);
        }
      }
      let nameFromCookie = getCookie("userName");
      if (nameFromCookie) {
        $("h2").prepend("Hello, " + nameFromCookie + "! ");
      }

      // -------------------------------
      // Local Storage for tasks
      // -------------------------------
      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

      // function to display all tasks
      function showTasks() {
        $("#taskList").empty();
        for (let i = 0; i < tasks.length; i++) {
          $("#taskList").append(
            "<li>" + tasks[i] +
            " <button class='delete-btn' data-id='" + i + "'>Delete</button></li>"
          );
        }
      }

      // Add new task
      $("#addBtn").click(function() {
        let text = $("#taskInput").val().trim();
        if (text == "") {
          alert("Please enter a task!");
        } else {
          tasks.push(text);
          localStorage.setItem("tasks", JSON.stringify(tasks));
          $("#taskInput").val("");
          showTasks();
        }
      });

      // Delete task
      $(document).on("click", ".delete-btn", function() {
        let index = $(this).data("id");
        tasks.splice(index, 1);
        localStorage.setItem("tasks", JSON.stringify(tasks));
        showTasks();
      });

      // Show tasks when page loads
      showTasks();
    });
  </script>
</body>
</html>
