<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Friendly Multi-User To-Do App</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .todo-box {
      background: #fff;
      width: 360px;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      transition: all 0.3s ease;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #333;
      font-weight: 600;
    }

    .input-area {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    input {
      width: 75%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 8px 12px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #45a049;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 250px;
      overflow-y: auto;
    }

    li {
      background: #f8f8f8;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    .delete-btn {
      background: #ff4d4d;
      border: none;
      color: white;
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .delete-btn:hover {
      background: #e60000;
    }

    .session-info {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }

    .user-switch {
      display: block;
      margin: 10px auto;
      font-size: 13px;
      color: #007bff;
      text-align: center;
      cursor: pointer;
    }

    .user-switch:hover {
      text-decoration: underline;
    }

    /* === Login screen === */
    .login-screen {
      text-align: center;
    }

    select, .login-input {
      padding: 8px;
      width: 80%;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="todo-box" id="loginBox">
    <div class="login-screen">
      <h2>👋 Welcome!</h2>
      <p style="color:#555;">Select your name or create a new account</p>
      <select id="userSelect">
        <option value="">-- Choose User --</option>
      </select><br>
      <input type="text" id="newUserInput" class="login-input" placeholder="New user name">
      <button id="loginBtn">Login</button>
    </div>
  </div>

  <div class="todo-box hidden" id="appBox">
    <h2 id="welcomeTitle">📝 To-Do App</h2>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Enter a task...">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="session-info" id="sessionInfo"></div>
    <span class="user-switch" id="switchUser">🔁 Switch User</span>
  </div>

  <script>
    // === COOKIE HELPERS ===
    function setCookie(name, value, days) {
      let expires = "";
      if (days) {
        let date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (value || "") + expires + "; path=/";
    }

    function getCookie(name) {
      let nameEQ = name + "=";
      let ca = document.cookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
    }

    $(document).ready(function() {
      // === SESSION INFO ===
      if (!sessionStorage.getItem("userSession")) {
        let sessionId = "User-" + Math.floor(Math.random() * 1000);
        sessionStorage.setItem("userSession", sessionId);
      }
      let currentSession = sessionStorage.getItem("userSession");
      $("#sessionInfo").text("Session Active: " + currentSession);

      // === LOAD EXISTING USERS ===
      let userList = JSON.parse(localStorage.getItem("users")) || [];
      userList.forEach(user => {
        $("#userSelect").append(`<option value="${user}">${user}</option>`);
      });

      // === LOGIN HANDLING ===
      $("#loginBtn").click(function() {
        let selectedUser = $("#userSelect").val();
        let newUser = $("#newUserInput").val().trim();
        let userName = selectedUser || newUser;

        if (!userName) {
          alert("Please select or enter a user name.");
          return;
        }

        if (!userList.includes(userName)) {
          userList.push(userName);
          localStorage.setItem("users", JSON.stringify(userList));
          alert("✨ Welcome, " + userName + "! Your new account is ready.");
        } else {
          alert("👋 Welcome back, " + userName + "!");
        }

        setCookie("userName", userName, 7);
        startApp(userName);
      });

      // === MAIN APP LOGIC ===
      function startApp(userName) {
        $("#loginBox").addClass("hidden");
        $("#appBox").removeClass("hidden");
        $("#welcomeTitle").html("📝 Hello, <b>" + userName + "</b>!");
        runTodoApp(userName);
      }

      let cookieUser = getCookie("userName");
      if (cookieUser) startApp(cookieUser);

      // === TODO APP PER USER ===
      function runTodoApp(nameFromCookie) {
        function loadTasks() {
          return JSON.parse(localStorage.getItem("tasks_" + nameFromCookie)) || [];
        }

        function saveTasks(tasks) {
          localStorage.setItem("tasks_" + nameFromCookie, JSON.stringify(tasks));
        }

        let tasks = loadTasks();

        function showTasks() {
          $("#taskList").empty();
          if (tasks.length === 0) {
            $("#taskList").append("<li style='text-align:center;color:#888;'>No tasks yet — add one above!</li>");
          } else {
            for (let i = 0; i < tasks.length; i++) {
              $("#taskList").append(
                "<li>" + tasks[i] +
                " <button class='delete-btn' data-id='" + i + "'>Delete</button></li>"
              );
            }
          }
        }

        $("#addBtn").off("click").on("click", function() {
          let text = $("#taskInput").val().trim();
          if (text === "") {
            alert("Please enter a task!");
          } else {
            tasks.push(text);
            saveTasks(tasks);
            $("#taskInput").val("");
            showTasks();
          }
        });

        $(document).off("click", ".delete-btn").on("click", ".delete-btn", function() {
          let index = $(this).data("id");
          tasks.splice(index, 1);
          saveTasks(tasks);
          showTasks();
        });

        $("#switchUser").off("click").on("click", function() {
          setCookie("userName", "", -1);
          location.reload();
        });

        showTasks();
      }
    });
  </script>
</body>
</html>
